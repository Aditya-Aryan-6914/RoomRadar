{% extends "base.html" %}{% block title %}Register your campus{% endblock %}
{% block content %}
<div class="panel narrow"><h2>Register your college</h2>
<p class="muted">Creates your own empty dashboard. You will upload timetables next.</p>
<form method="post" class="form">{% csrf_token %}{{ form.as_div }}<button class="btn">Create account</button></form>
<p class="muted">Already registered? <a href="{% url 'login' %}">Log in</a>.</p></div>
{% endblock %}
